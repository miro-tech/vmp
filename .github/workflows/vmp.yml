name: VMP VPN Update

on:
schedule:
- cron: "1 1 * * *"
workflow_dispatch:

permissions:
contents: read

concurrency:
group: vmp-update
cancel-in-progress: false

jobs:
update:
runs-on: ubuntu-latest
timeout-minutes: 15

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Fetch VMP configurations
    run: |
      set -e
      python vmp_fetch.py > vmp.txt
      test -s vmp.txt
      echo "Конфигурации получены: $(wc -l < vmp.txt) строк"
      head -c 200 vmp.txt
      echo

  - name: Update GitHub Gist
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
    run: |
      python - <<'PY'
      import json
      import os
      import urllib.request
      from pathlib import Path

      token = os.environ["GIST_TOKEN"]
      gist_id = os.environ["GIST_ID"]
      content = Path("vmp.txt").read_text(encoding="utf-8")

      if not content.strip():
          raise SystemExit("Ошибка: файл vmp.txt пустой")

      payload = {
          "files": {
              "vmp.txt": {
                  "content": content
              }
          }
      }

      req = urllib.request.Request(
          f"https://api.github.com/gists/{gist_id}",
          data=json.dumps(payload).encode("utf-8"),
          headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "VMP-Gist-Updater"
          },
          method="PATCH"
      )

      with urllib.request.urlopen(req, timeout=60) as response:
          result = json.load(response)
          print("Gist успешно обновлён")
          print("URL:", result.get("html_url", ""))
          print("Файл: vmp.txt")
      PY
